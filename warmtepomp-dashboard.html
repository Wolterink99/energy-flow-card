<title>Warmtepomp SPRSUN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Outfit:wght@300;400;700&display=swap">
<style>
/* Layout: alleen de popup van de warmtepomp (wandtablet). Links het installatieschema met de kast
   (ventilator links over de volle hoogte, onderdelen rechts), de leidingen naar het boilervat en een
   plat gelegde vloerverwarming. Rechts tabbladen met overzicht, instellingen, tijdschema en waarden.
   Bewust één donker thema, passend bij het huisdashboard. */
:root{
  color-scheme:dark;
  --backdrop:#07080c;
  --panel:#12151c; --panel-2:#181c26; --panel-3:#20252f; --line:#272c38; --line-2:#323949;
  --fg:#e9ebf1; --muted:#8a92a3; --dim:#5d6575;
  --accent:#ff8d4d; --accent-soft:rgba(255,141,77,.16); --accent-ink:#1d0f06;
  --ok:#4ade80; --warn:#fbbf24; --cold:#60a5fa; --hot:#f87171; --ice:#7dd3fc;
  --f-display:"Outfit","Figtree",system-ui,sans-serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(120% 100% at 50% 0%,#141a26 0%,var(--backdrop) 70%);color:var(--fg);font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.hit{cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;font-weight:500}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.badge{font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:6px;background:var(--panel-3);color:var(--muted);white-space:nowrap}
.badge.heat{background:rgba(251,146,60,.16);color:#fdba74}
.badge.dhw{background:rgba(251,191,36,.15);color:#fcd34d}
.badge.cool{background:rgba(96,165,250,.16);color:#93c5fd}
.badge.defrost{background:rgba(125,211,252,.16);color:#bae6fd}
.badge.off{background:rgba(248,113,113,.16);color:#fca5a5}
.reopen{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);min-height:56px;padding:0 22px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;display:inline-flex;gap:10px;align-items:center}

/* ---------- popup ---------- */
.modal{position:fixed;left:50%;top:50%;width:min(1440px,calc(100vw - 32px));height:min(900px,calc(100vh - 32px));transform:translate(-50%,-50%);display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--panel);border:1px solid var(--line-2);border-radius:22px;box-shadow:0 40px 100px rgba(0,0,0,.6);overflow:hidden}
.m-head{display:flex;align-items:center;gap:14px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.m-title{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.m-title .ico{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.m-title h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1}
.m-title p{margin:2px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-title .badge{font-size:12px;padding:5px 9px}
.m-actions{display:flex;gap:8px;align-items:center;position:relative}
.icon-btn{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line)}
.power-btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 16px 0 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font-weight:600}
.power-btn .i{width:22px;height:22px;stroke-width:2.2}
.power-btn[aria-checked="true"]{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.45);color:#bbf7d0}
.power-btn[aria-checked="true"] .i{color:var(--ok)}
.power-btn[aria-checked="false"] .i{color:var(--hot)}
.sim{min-height:48px}
.confirm{position:absolute;right:56px;top:56px;z-index:5;width:320px;display:grid;gap:12px;padding:14px;border-radius:14px;background:#1d222c;border:1px solid rgba(248,113,113,.45);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.confirm div{display:flex;gap:8px;justify-content:flex-end}
.sim-menu{position:absolute;top:56px;right:0;z-index:6;min-width:270px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.sim-menu button{display:flex;width:100%;min-height:46px;padding:6px 12px;border-radius:10px;text-align:left;line-height:1.3}
.sim-menu button:hover{background:var(--panel-2)}
.sim-menu button[aria-checked="true"]{background:var(--accent-soft);color:#ffd2b8}
.sim-menu small{color:var(--muted);font-size:11.5px}
.sim-menu .sep{height:1px;background:var(--line);margin:6px 4px}
.btn{min-height:44px;padding:0 16px;border-radius:11px;background:var(--panel-3);border:1px solid var(--line);font-weight:600}
.btn.danger{background:rgba(248,113,113,.18);border-color:rgba(248,113,113,.45);color:#fecaca}

.m-body{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(380px,1fr);min-height:0}
.m-schema{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;background:radial-gradient(120% 90% at 30% 20%,#161b25 0%,#0e1117 70%);border-right:1px solid var(--line)}
.m-schema svg{width:100%;height:100%;display:block;min-height:0}
.lamps{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 14px;border-top:1px solid var(--line);align-items:center}
#lampRow{display:contents}
.lamp{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.lamp i{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.lamp.on{color:var(--fg)}
.lamp.on i{background:var(--ok);box-shadow:0 0 0 4px rgba(74,222,128,.15)}
.lamp.on.ice i{background:var(--ice);box-shadow:0 0 0 4px rgba(125,211,252,.18)}
.lamp.status{margin-left:auto;color:var(--fg);background:transparent;border-color:transparent;padding-right:0}

.m-side{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:11px;white-space:nowrap;color:var(--muted);font-weight:500;background:var(--panel-2);border:1px solid transparent}
.tab[aria-selected="true"]{color:var(--fg);border-color:rgba(255,141,77,.45);background:var(--accent-soft)}
.m-panel{overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 28px}
.panel{display:grid;gap:20px}
.sec{display:grid;gap:10px}
.sec-h{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec-h em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;color:var(--dim);margin-left:auto}
.box{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r)}
.row{display:grid;gap:10px;padding:14px 16px}
.row + .row{border-top:1px solid var(--line)}
.row-line{display:flex;align-items:center;gap:12px;min-width:0}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--panel-3);color:#c8ced9;flex:none}
.row-text{flex:1;min-width:0}
.row-title{font-weight:600;font-size:15px}
.row-sub{color:var(--muted);font-size:12px;margin-top:2px}

.statusbox{padding:16px;display:grid;gap:4px}
.statusbox b{font-size:17px;font-weight:600}
.statusbox span{color:var(--muted);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{padding:12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);display:grid;gap:4px;min-width:0;text-align:left}
.tile span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{font-size:20px;font-weight:500;white-space:nowrap}
.tile b small{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:2px}
.tile em{font-style:normal;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.seg button{min-height:52px;padding:8px 12px;border-radius:12px;background:var(--panel-3);border:1px solid var(--line);text-align:left;display:flex;align-items:center;gap:10px;font-weight:500;font-size:13.5px;line-height:1.2}
.seg button .i{color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:rgba(255,141,77,.6);color:#ffe1cf}
.seg button[aria-pressed="true"] .i{color:var(--accent)}
.seg.compact button{min-height:46px;justify-content:center;text-align:center}
.confirmed{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.confirmed b{color:var(--fg);font-weight:600}
.confirmed .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.step-ctrl{display:flex;align-items:center;gap:6px;flex:none}
.step{width:48px;height:48px;border-radius:12px;background:var(--panel-3);border:1px solid var(--line);font-size:24px;line-height:1;font-weight:300;display:grid;place-items:center}
.step:active{background:var(--accent-soft);border-color:rgba(255,141,77,.5)}
.step-val{min-width:80px;text-align:center;font-size:22px;font-weight:500}
.step-val small{font-size:12px;color:var(--muted);margin-left:2px;font-weight:400}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--trk,var(--accent)) var(--p,50%),var(--panel-3) var(--p,50%))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--trk,var(--accent)) var(--p,50%),var(--panel-3) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#f4f5f8;border:4px solid var(--trk,var(--accent));margin-top:-10px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#f4f5f8;border:4px solid var(--trk,var(--accent))}
.range-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:-6px}
.switch{width:60px;height:36px;border-radius:18px;background:var(--panel-3);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#9aa2b2;transition:transform .22s,background .22s}
.switch[aria-checked="true"]{background:rgba(255,141,77,.35);border-color:rgba(255,141,77,.6)}
.switch[aria-checked="true"]::after{transform:translateX(24px);background:#fff}

.list .li{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px}
.list .li + .li{border-top:1px solid var(--line)}
.li .sw{width:9px;height:9px;border-radius:3px;flex:none;background:var(--dim)}
.li .lt{flex:1;min-width:0}
.li .lt small{display:block;color:var(--dim);font-size:11px}
.li b{font-weight:600;white-space:nowrap}

.chart-wrap{padding:12px 10px 8px}
.chart-wrap svg{width:100%;height:auto;display:block}
.chart-wrap text{font:11px var(--f-ui);fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:4px 6px}
.legend button{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 11px;border-radius:9px;background:var(--panel-3);border:1px solid var(--line);font-size:12.5px}
.legend button i{width:10px;height:10px;border-radius:50%}
.legend button[aria-pressed="false"]{opacity:.45}

.week{padding:14px 12px 12px;display:grid;gap:6px}
.week-hours,.week-row{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:center;gap:8px}
.week-hours div{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim)}
.week-row > b{font-size:12.5px;font-weight:600;color:#c9cfda}
.cells{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:2px;touch-action:none}
.cells span{height:34px;border-radius:4px;background:var(--panel-3)}
.cells span.on{background:linear-gradient(180deg,#ffa36e,#f07b3c)}
.week-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-top:6px}
.key{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* tekst en kast in het schema */
.tag-l{font:500 12px var(--f-ui);fill:#8a92a3;letter-spacing:.02em}
.tag-v{font:600 16px var(--f-ui);fill:#f1f3f7}
.cap{font:700 10.5px var(--f-ui);fill:#6b7385;letter-spacing:.14em}
.big-t{font:700 30px var(--f-ui);fill:#fff}
#schema .hit:hover > rect:first-child{stroke:#4a5366}
#schema .front{transition:opacity .5s;cursor:pointer}
#schema{background:linear-gradient(180deg,#0b1020,#1a2542 55%,#141a24 85%)}
#schema .bub circle{transform-box:fill-box;animation:rise 4.5s ease-in infinite}
#schema .wave path{animation:waft 3.2s ease-out infinite}
#warmG{transition:transform 1.8s cubic-bezier(.4,0,.2,1)}
#waveG{animation:wv 2.6s linear infinite}
@keyframes wv{to{transform:translateX(-40px)}}
.think{padding:14px 16px;display:grid;gap:12px}
.th-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.th-more{font-size:12.5px;font-weight:600;color:var(--accent);min-height:36px;padding:0 10px;border-radius:9px;background:var(--accent-soft)}
.th-sub{color:var(--muted);font-size:13px;margin-top:-6px}
.th-steps{display:grid;gap:12px;padding-top:6px;border-top:1px solid var(--line)}
.th-sum{font-weight:600;font-size:21px;line-height:1.25}
.th-step{display:flex;gap:12px;align-items:flex-start}
.th-step i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.th-step b{display:block;font-size:13px;margin-bottom:2px}
.th-step span{color:var(--muted);font-size:12.5px;line-height:1.45}
.row.dim{opacity:.45;pointer-events:none}
#fc svg{width:100%;height:auto;display:block}
#fc svg text{fill:#8a92a3;font:500 10px var(--f-ui)}
.batt{padding:16px;display:grid;gap:12px}
.batt-top{display:flex;align-items:center;justify-content:space-between}
.batt-top b{font-size:34px;font-weight:500}
.batt-top small{font-size:15px;color:var(--muted);margin-left:2px}
.chip-s{font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;background:var(--panel-3);color:var(--muted)}
.chip-s.on{background:rgba(74,222,128,.15);color:#86efac}
.batt-bar{height:12px;border-radius:6px;background:var(--panel-3);overflow:hidden}
.batt-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#60a5fa,#4ade80)}
.batt-sub{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-260px);opacity:0}}
@keyframes waft{0%{transform:translateY(0);opacity:0}25%{opacity:.7}100%{transform:translateY(-34px);opacity:0}}
@media (prefers-reduced-motion:reduce){#schema .bub,#schema .wave{display:none}}
#schema .inner{opacity:0;pointer-events:none;transition:opacity .5s}
#schema.open .front{opacity:0;pointer-events:none}
#schema.open .inner{opacity:1;pointer-events:auto}

.toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:40;background:#1d222c;border:1px solid #333a49;border-radius:12px;padding:12px 16px;font-size:13.5px;display:flex;gap:10px;align-items:center;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .i{color:var(--ok)}

@media (max-width:1500px){
  .tab .i{display:none}
  .tab{padding:0 12px}
}
@media (max-width:1100px){
  .m-body{grid-template-columns:minmax(0,1.25fr) minmax(330px,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  body{overflow:auto}
  .modal{position:relative;left:0;top:0;transform:none;width:100%;height:auto;min-height:100%;border-radius:0;border:0}
  .m-body{grid-template-columns:1fr}
  .m-schema{border-right:0;border-bottom:1px solid var(--line)}
  .m-schema svg{height:auto;aspect-ratio:1160/560}
  .m-side{grid-template-rows:auto auto}
  .m-panel{overflow:visible}
  .m-title{flex-basis:100%}
  .m-actions{margin-left:auto}
  .row-line{flex-wrap:wrap}
  .step-ctrl{margin-left:auto}
  .m-head{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .confirm{right:0;width:min(320px,calc(100vw - 32px))}
  .sim span:last-child{display:none}
}
</style>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <header class="m-head">
    <div class="m-title">
      <span class="ico"><svg class="i" viewBox="0 0 24 24" style="width:24px;height:24px"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="10" cy="12" r="4"/><path d="M17 8v8"/></svg></span>
      <div style="min-width:0"><h2 id="mTitle">Warmtepomp</h2><p id="mSub">SPRSUN warmtepomp · Carel-regelaar</p></div>
      <b class="badge" id="mBadge">Stand-by</b>
    </div>
    <div class="m-actions">
      <button class="icon-btn" id="mClose" aria-label="Sluiten"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>
  <div class="m-body">
    <section class="m-schema">
      <svg id="schema" viewBox="170 90 990 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Installatieschema warmtepomp, buffervat en vloerverwarming">
        <defs>
          <linearGradient id="tankShine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".22" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient>
          <linearGradient id="coldGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
          <linearGradient id="warmGrad" x1="0" y1="0" x2="0" y2="1"><stop id="tankTop" offset="0" stop-color="#ef4444"/><stop id="tankBot" offset="1" stop-color="#b91c1c"/></linearGradient>
          <linearGradient id="floorGlowGrad" x1="0" y1="1" x2="0" y2="0"><stop id="floorGlowStop" offset="0" stop-color="#fb923c" stop-opacity=".34"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></linearGradient>
          <linearGradient id="roomGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2235"/><stop offset="1" stop-color="#2a2f44"/></linearGradient>

/* 24-uurs grafiek (mock-historie; in HA te vervangen door de history-API) */
const SERIES = [
  { key: 'boiler', label: 'Boiler', color: '#3b82f6', on: true },
  { key: 'setpoint', label: 'Setpoint', color: '#fbbf24', on: true },
  { key: 'aanvoer', label: 'Aanvoer', color: '#f87171', on: true },
  { key: 'retour', label: 'Retour', color: '#34d399', on: true },
  { key: 'buiten', label: 'Buiten', color: '#a78bfa', on: true },
];
const HISTORY = (() => {
  const out = { boiler: [], setpoint: [], aanvoer: [], retour: [], buiten: [] };
  let b = 38, heating = false, sup = 22, seed = 3;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280 - .5;
  for (let i = 0; i < 97; i++) {
    if (b < 35.5) heating = true;
    if (b >= 40.5) heating = false;
    b += heating ? 1.1 : -0.22;
    sup += ((heating ? 46 : 19) - sup) * 0.45;
    out.boiler.push(b); out.setpoint.push(40.5);
    out.aanvoer.push(sup + rnd()); out.retour.push(sup + (heating ? -5 : 3.5) + rnd());
    out.buiten.push(9.5 + 2.6 * Math.sin((i / 4 - 9) / 24 * Math.PI * 2) + rnd() * .6);
  }
  return out;
})();
function buildChart() {
  const W = 520, H = 220, L = 30, R = 10, T = 10, B = 26;
  const x = (i) => L + (W - L - R) * i / 96, y = (v) => T + (H - T - B) * (1 - (v - 5) / 50);
  const startH = (new Date().getHours() + 1) % 24;
  let g = '';
  for (let v = 10; v <= 50; v += 10) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#232834"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  for (let k = 0; k <= 4; k++) { const i = k * 24; g += `<text x="${x(i)}" y="${H - 8}" text-anchor="${k === 0 ? 'start' : k === 4 ? 'end' : 'middle'}">${k === 4 ? 'nu' : String((startH + k * 6) % 24).padStart(2, '0') + ':00'}</text>`; }
  SERIES.forEach(s => {
    if (!s.on) return;
    const d = HISTORY[s.key].map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.key === 'setpoint' ? 1.5 : 2}" ${s.key === 'setpoint' ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round"/><circle cx="${x(96)}" cy="${y(HISTORY[s.key][96])}" r="3.5" fill="${s.color}" stroke="#181c26" stroke-width="2"/>`;
  });
  $('#chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Temperatuurverloop afgelopen 24 uur">${g}</svg>`;
  $('#legend').innerHTML = SERIES.map(s => `<button data-series="${s.key}" aria-pressed="${s.on}"><i style="background:${s.color}"></i>${s.label}</button>`).join('');
}

document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('#reopen')) { openModal(); return; }
  if (t.closest('#hpFront') || t.closest('#fanGroup')) { hpTap(); return; }
  if (t.closest('#mClose')) { closeModal(); return; }
  const tab = t.closest('[data-tab]');

  const segb = t.closest('[data-seg] button');
  if (segb) { const key = segb.closest('[data-seg]').dataset.seg; setValue(key, segb.dataset.val); if (key === 'mode' && SIM.active) setTimeout(() => { state.mode_confirmed = state.mode; render(); }, 900); toast(`${segb.dataset.val} ingesteld`); return; }

});

}
document.addEventListener('pointerdown', (e) => {
  const btn = e.target.closest('.step'); if (!btn) return;
  e.preventDefault();
  pendingKey = stepOnce(btn);
  holdT = setTimeout(() => { holdI = setInterval(() => stepOnce(btn), 110); }, 420);
});
function endHold() {
  clearTimeout(holdT); clearInterval(holdI);
  if (pendingKey) { const c = STEP[pendingKey]; sendToHA(pendingKey, state[pendingKey]); toast(`${c.label}: ${fmt(state[pendingKey], c.d ?? 1)} ${c.unit}`); pendingKey = null; }
}
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, endHold));
document.addEventListener('input', (e) => { const r = e.target.closest('[data-stepper] input'); if (r) setValue(r.closest('[data-stepper]').dataset.stepper, +r.value, false); });
document.addEventListener('change', (e) => {
  const r = e.target.closest('[data-stepper] input');
  if (r) { const key = r.closest('[data-stepper]').dataset.stepper, c = STEP[key]; sendToHA(key, state[key]); toast(`${c.label}: ${fmt(state[key], c.d ?? 1)} ${c.unit}`); }
});

/* ---------------- animatie ----------------
   Zuinig voor een wandtablet: maximaal 20 beelden per seconde, de lus stopt volledig zodra er niets
   beweegt (stand-by) en ook als de popup dicht is of het scherm verborgen is. */
let fanA = 0, pumpA = 0, last = performance.now(), lastDraw = 0, rafId = 0;
const FRAME_MS = 1000 / 20;
function animating() {
  if (RM || document.hidden || $('#modal').hidden) return false;
  const f = flows();
  return f.ref > 0 || f.hp > 0 || f.floor > 0 || (state.power && !state.defrost && state.fan1_rpm > 0);
}
function kick() { if (!rafId && animating()) { last = performance.now(); rafId = requestAnimationFrame(frame); } }
function frame(now) {
  rafId = 0;
  if (!animating()) return;
  if (now - lastDraw >= FRAME_MS) {
    const dt = Math.min(.1, (now - last) / 1000); last = now; lastDraw = now;
    const s = state, f = flows();
    // De ventilator draait ook achter het rooster van de dichte kast.
    const spin = s.power && !s.defrost;
    fanA += (spin ? s.fan1_rpm : 0) / 60 * 360 * dt * .16;
    $('#fanRot').setAttribute('transform', `rotate(${(fanA % 360).toFixed(1)})`);
    pumpA += f.hp * 720 * dt;
    $('#pumpRot').setAttribute('transform', `rotate(${(pumpA % 360).toFixed(1)})`);
    const move = (keys, speed) => keys.forEach(k => { pipes[k].offset -= speed * dt; pipes[k].flow.style.strokeDashoffset = pipes[k].offset; });
    move(['discharge', 'liquid', 'expansion', 'suction'], f.ref * 50);
    move(['hpSup', 'hpRet'], f.hp * 46);
    move(['flSup', 'floor', 'flRet'], f.floor * 40);
  }
  rafId = requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', kick);

/* ---------------- simulatie-ruis, wake lock ---------------- */
setInterval(() => {
  if (document.hidden || $('#modal').hidden || !SIM.active || !state.compressor || !state.power) return;
  const j = (v, a) => +(v + (Math.random() - .5) * a).toFixed(1);
  state.comp_hz = j(state.comp_hz, 1.2);
  state.t_supply = j(state.t_supply, .2);
  state.t_return = j(state.t_return, .2);
  state.t_discharge = j(state.t_discharge, .6);
  state.power_w = Math.round(state.power_w + (Math.random() - .5) * 40);
  if (SIM.active === 'verwarmen' || SIM.active === 'boost') {
    // het vat loopt vol naar het doel; is het bereikt, dan gaat de warmtepomp in rust
    state.t_boiler = +Math.min(state.sp_boiler_reg, state.t_boiler + .5).toFixed(1);
    if (state.t_boiler >= state.sp_boiler_reg) {
      const tb = state.t_boiler, sp = state.sp_boiler_reg;
      Object.assign(state, BASE, SCENARIOS.rest.patch, userSettings, { t_boiler: tb, sp_boiler_reg: sp, smart_target: sp }); SIM.active = 'rest'; render(); return;
    }
  }
  renderHead(); renderSchema();
  if (currentTab !== 'instellingen') renderPanel();
}, 2500);
(async () => { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {} })();

function render() { renderHead(); renderSchema(); renderPanel(); kick(); }

applyScenario(SIM.active);
openModal('overzicht');
kick();
</script>
